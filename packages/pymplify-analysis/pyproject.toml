[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pymplify-analysis"
version = "0.1.0"
description = "Static Python API inspection and explainable workflow simplification proposals."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Pymplify contributors"}]
keywords = ["python", "ast", "analysis", "pymplify"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = ["pymplify-core>=0.2.0,<0.3"]

[project.urls]
Repository = "https://github.com/knbww/pymplify"
Documentation = "https://github.com/knbww/pymplify/blob/main/docs/analysis-api.md"
Issues = "https://github.com/knbww/pymplify/issues"

[project.scripts]
pymplify-analyze = "pymplify_analysis.cli:main"

[project.entry-points."pymplify.adapters"]
analysis = "pymplify_analysis.adapter:get_adapter"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pymplify_analysis = ["py.typed"]
