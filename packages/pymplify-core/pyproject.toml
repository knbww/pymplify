[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pymplify-core"
version = "0.2.0"
description = "Adapter contracts, operation catalogs, and shared utilities for Pymplify."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Pymplify contributors"}]
keywords = ["ai", "ml", "pymplify"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Repository = "https://github.com/knbww/pymplify"
Documentation = "https://github.com/knbww/pymplify/blob/main/docs/catalog-api.md"
Issues = "https://github.com/knbww/pymplify/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pymplify_core = ["py.typed"]
