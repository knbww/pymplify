name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .

  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.14"
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e ./packages/pymplify-core -e ./packages/pymplify-text -e ./packages/pymplify-tabular -e ./packages/pymplify-analysis
      - run: python -m pytest --cov --cov-report=term-missing
      - run: python examples/text_vectors.py
      - run: python examples/tabular_scaling.py
      - run: python examples/adapter_catalog.py
      - run: python examples/analyze_workflows.py
      - run: python -m pymplify_analysis code examples/upstream_workflow.py --json

  minimum-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install "numpy<2" "scikit-learn==1.4.2" -e ./packages/pymplify-core -e ./packages/pymplify-text -e ./packages/pymplify-tabular -e ./packages/pymplify-analysis
      - run: python -m pytest

  distributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m build packages/pymplify-core --outdir dist
      - run: python -m build packages/pymplify-text --outdir dist
      - run: python -m build packages/pymplify-tabular --outdir dist
      - run: python -m build packages/pymplify-analysis --outdir dist
      - run: python -m twine check --strict dist/*
      - name: Install built wheels in a clean environment
        run: |
          python -m venv /tmp/pymplify-wheel-check
          /tmp/pymplify-wheel-check/bin/python -m pip install dist/*.whl
          /tmp/pymplify-wheel-check/bin/python -m pip check
          /tmp/pymplify-wheel-check/bin/python examples/text_vectors.py
          /tmp/pymplify-wheel-check/bin/python examples/tabular_scaling.py
          /tmp/pymplify-wheel-check/bin/python examples/adapter_catalog.py
          /tmp/pymplify-wheel-check/bin/python examples/analyze_workflows.py
          /tmp/pymplify-wheel-check/bin/python -m pymplify_analysis code examples/upstream_workflow.py --json
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/*
